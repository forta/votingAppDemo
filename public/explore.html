<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>Juegos · Kunsido</title>
  <link rel="stylesheet" href="player/style.css">
  <script defer src="explore.js?v=20261020-1"></script>
</head>
<body>
  <main class="explorer">
    <header><a href="/" class="player-home" aria-label="Kunsido"><img src="/static/pics/logo.png" alt="Kunsido"></a><a href="/games/" id="games-link">Juegos</a><div class="header-actions"><span id="account-name" class="account-name" hidden></span><label class="language"><span>Idioma</span>
      <select id="language" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="eo">Esperanto</option></select></label></div></header>
    <p class="eyebrow">PLAYER MULTIJUEGO</p>
    <h1 id="title">Explorar partidas</h1>
    <p id="intro" class="intro">Elige un tipo de juego o explora todas las partidas disponibles.</p>
    <section class="connection">
      <label for="game-type" id="game-type-label">Tipo de juego</label>
      <select id="game-type">
        <option value="">Todos los juegos</option>
        <option value="whattheshell">What the Shell</option>
        <option value="ink">Ink</option>
      </select>
    </section>
    <section class="connection"><span id="indicator"></span><strong id="status" role="status" aria-live="polite">Cargando partidas…</strong>
      <button id="refresh" type="button">Actualizar lista</button></section>
    <p><button id="toggle-unavailable" type="button" hidden></button></p>
    <section id="games" class="game-list" aria-live="polite"></section>
    <footer><a href="/games/" id="games-footer-link">Volver a los juegos</a></footer>
  </main>
</body>
</html>
