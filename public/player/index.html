<!doctype html>
<html lang="es">
<head>
  <base href="./">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partida · Juegos</title>
  <link rel="stylesheet" href="player/style.css?v=20261022-2">
  <script defer src="theme.js?v=20261020-1"></script>
  <script defer src="player/play.js?v=20261022-7"></script>
</head>
<body>
  <main>
    <header><a href="/landing/" id="home-brand" aria-label="Kunsido"><img src="logo.png" alt="Kunsido"><span id="brand-name">Kunsido</span></a><a href="/games/" id="games-link" data-i18n="gamesLink"></a><div class="header-actions"><span id="account-name" class="account-name" hidden></span><select id="language" aria-label="Language"><option value="es">Español</option><option value="en">English</option><option value="eo">Esperanto</option></select></div></header>
    <p class="eyebrow" id="game-kind"></p>
    <h1 data-i18n="title"></h1>
    <p id="game-description" class="intro" data-i18n="intro"></p>
    <section class="status-card">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="sequence" class="meta"></p>
      <button id="refresh" data-i18n="refresh"></button>
      <button id="start" data-i18n="startGame" hidden></button>
    </section>
    <section id="sequence-event-status" class="status-card" aria-live="polite">
      <h2 data-i18n="sequenceEventsTitle"></h2>
      <p class="meta" data-i18n="sequenceEventsHint"></p>
      <p><strong id="sequence-event-count">0</strong> <span data-i18n="sequenceEventsCount"></span></p>
      <p id="sequence-event-connection" class="meta" data-i18n="sequenceEventsConnecting"></p>
    </section>
    <section id="slots-panel">
      <h2 data-i18n="slotsTitle"></h2>
      <p id="slots-hint" class="muted" data-i18n="slotsHint"></p>
      <div id="slots" class="slots"></div>
      <button id="release" data-i18n="releaseSlot" hidden></button>
    </section>
    <section id="renderer-panel" class="renderer-panel" hidden>
      <label for="renderer" data-i18n="rendererLabel"></label>
      <select id="renderer">
        <option value="generic" data-i18n="rendererGeneric"></option>
        <option value="ink" data-i18n="rendererInk"></option>
        <option value="whattheshell" data-i18n="rendererWts"></option>
      </select>
      <p class="muted" data-i18n="rendererHint"></p>
      <p id="renderer-error" class="error" role="status"></p>
    </section>
    <div id="game-view" class="game-view" data-game-handler="generic" aria-live="polite" hidden></div>
    <footer><a href="/games/" data-i18n="gamesLink"></a></footer>
  </main>
  <dialog id="slot-dialog">
    <form id="slot-form">
      <h2 id="dialog-title"></h2>
      <label id="alias-field"><span data-i18n="aliasLabel"></span><input id="alias" maxlength="60" autocomplete="nickname"></label>
      <label id="pin-field"><span data-i18n="pinLabel"></span><input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code"></label>
      <p id="dialog-error" class="error" role="alert"></p>
      <div class="actions"><button id="claim" type="submit" data-i18n="claimSlot"></button><button id="cancel" type="button" data-i18n="cancel"></button></div>
    </form>
  </dialog>
  <dialog id="access-dialog">
    <form id="access-code-form">
      <h2 data-i18n="accessCodeTitle"></h2>
      <p data-i18n="accessCodePrompt"></p>
      <label for="access-code" data-i18n="accessCodeLabel"></label>
      <input id="access-code" name="accessCode" maxlength="5" minlength="5" pattern="[A-Za-z]{5}" autocomplete="one-time-code" required>
      <p id="access-code-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="submit" data-i18n="accessCodeSubmit"></button>
        <button id="access-code-cancel" type="button" data-i18n="cancel"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
